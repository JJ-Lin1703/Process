<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - BPMN 智能建模</title>
    <link rel="stylesheet" href="frontend_resource/CSS/01-variables.css">
    <link rel="stylesheet" href="frontend_resource/CSS/02-base.css">
    <link rel="stylesheet" href="frontend_resource/CSS/08-components.css">
    <link rel="stylesheet" href="frontend_resource/CSS/11-toast.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 40px;
            background: var(--bg-surface);
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 1;
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 36px;
        }

        .login-logo svg {
            width: 32px;
            height: 32px;
            stroke-width: 2;
            fill: var(--accent);
        }

        .login-logo h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }

        .form-item {
            margin-bottom: 20px;
        }

        .form-item label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-item input {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 15px;
            color: var(--text-primary);
            border: 1px solid var(--border);
            background: var(--bg-input);
            transition: all var(--transition-fast);
        }

        .form-item input:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .form-item input::placeholder {
            color: var(--text-tertiary);
        }

        .submit-btn {
            width: 100%;
            height: 50px;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            border: none;
            background: var(--accent-gradient);
            box-shadow: 0 14px 22px rgba(97, 92, 246, 0.18);
            transition: all var(--transition-fast);
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 16px 28px rgba(97, 92, 246, 0.25);
        }

        .submit-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .tip {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .tip a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .tip a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            transition: color var(--transition-fast);
        }

        .back-link:hover {
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <a href="login.html" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>返回登录</span>
            </a>

            <div class="login-logo">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
                <h1>BPMN 智能建模</h1>
            </div>

            <div id="reset-panel">
                <h3 style="text-align: center; margin-bottom: 8px; font-size: 17px; font-weight: 600;">重置密码</h3>
                <p style="text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 24px;">请设置新的密码</p>
                
                <div class="form-item">
                    <label>新密码</label>
                    <input type="password" id="new-password" placeholder="请输入新密码">
                </div>
                <div class="form-item">
                    <label>确认密码</label>
                    <input type="password" id="confirm-password" placeholder="请再次输入密码">
                </div>
                <button class="submit-btn" onclick="resetPassword()">确认重置</button>
            </div>
        </div>
    </div>

    <script type="module" src="frontend_resource/js/reset-password.js"></script>
</body>
</html>
