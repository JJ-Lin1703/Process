<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI BPMN Modeling</title>

    <link rel="stylesheet" href="frontend_resource/CSS/01-variables.css">
    <link rel="stylesheet" href="frontend_resource/CSS/02-base.css">
    <link rel="stylesheet" href="frontend_resource/CSS/03-layout.css">
    <link rel="stylesheet" href="frontend_resource/CSS/04-sidebar.css">
    <link rel="stylesheet" href="frontend_resource/CSS/05-topbar.css">
    <link rel="stylesheet" href="frontend_resource/CSS/06-main-content.css">
    <link rel="stylesheet" href="frontend_resource/CSS/07-right-sidebar.css">
    <link rel="stylesheet" href="frontend_resource/CSS/08-components.css">
    <link rel="stylesheet" href="frontend_resource/CSS/09-modal.css">
    <link rel="stylesheet" href="frontend_resource/CSS/10-responsive.css">
    <link rel="stylesheet" href="frontend_resource/CSS/11-toast.css">
</head>

<body>
    <div class="app" id="app">
        <aside class="sidebar" id="sidebar">
            <button class="panel-toggle-btn" onclick="toggleLeftSidebar()" title="Collapse/Expand">
                <svg id="toggleIcon" width="18" height="18" viewBox="0 0 24 24">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor" />
                </svg>
            </button>

            <div class="sidebar-content">
                <div class="sidebar-header">
                    <div class="logo">
                        <div class="logo-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" stroke="#fff" stroke-width="2">
                                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                            </svg>
                        </div>
                        <div class="logo-meta">
                            <span class="logo-text">BPMN AI Modeling</span>
                        </div>
                    </div>
                </div>

                <button class="btn-new" onclick="switchToNewFlow()">
                    <span class="icon">+</span>
                    <span class="btn-text">New Flow</span>
                </button>

                <div class="history-section">
                    <div class="section-header">
                        <span class="section-title">History</span>
                    </div>
                    <div id="historyFlowList" class="history-list">
                        <div class="loading">Loading...</div>
                        <div class="empty-tip">No history yet</div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="bar-left">
                    <div class="title-group">
                        <h2 class="page-title" id="pageTitle">New Flow</h2>
                    </div>
                </div>

                <div class="bar-center">
                    <div id="newMsg" class="msg"></div>
                    <div id="historyMsg" class="msg"></div>
                </div>

                <div class="bar-right">
                    <input type="password" id="apiKey" class="input-key" placeholder="API Key">

                    <select id="modelName" class="select-model" aria-label="选择模型">
                        <option value="kimi-k2.6">kimi-k2.6</option>
                        <option value="qwen3.6-plus">qwen3.6-plus</option>
                        <option value="qwen3.5-flash">qwen3.5-flash</option>
                    </select>

                    <input type="number" id="temperature" class="input-temp" value="0.0" step="0.1" min="0" max="1"
                        title="温度">

                    <button class="btn-import" onclick="document.getElementById('importFile').click()">
                        <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3v10.17l3.59-3.58L17 11l-5 5-5-5 1.41-1.41L11 13.17V3h1zM5 19h14v2H5z"
                                fill="currentColor" />
                        </svg>
                        <span>Import BPMN</span>
                    </button>
                    <input type="file" id="importFile" accept=".bpmn" hidden onchange="importBpmn()">

                    <button id="authButton" class="btn-logout" onclick="handleAuth()">
                        <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M18 8h-1V6a6 6 0 0 0-6-6 6 6 0 0 0-6 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM8 6a4 4 0 0 1 4-4 4 4 0 0 1 4 4v2H8V6zm2 12v-8h4v8H10z" fill="currentColor" />
                        </svg>
                        <span>Login</span>
                    </button>
                </div>
            </header>

            <div class="content content-flex">
                <section class="main-stage">
                    <div class="editor-shell">
                        <div class="canvas-stack">
                            <div class="canvas-toolbar" role="toolbar" aria-label="BPMN画布工具栏">
                                <button type="button" class="canvas-tool-btn" onclick="saveBpmnEditor()" title="Save">
                                    <span>Save</span>
                                </button>
                                <button type="button" class="canvas-tool-btn" onclick="undoCanvas()" title="Undo">
                                    <span>Undo</span>
                                </button>
                                <button type="button" class="canvas-tool-btn" onclick="redoCanvas()" title="Redo">
                                    <span>Redo</span>
                                </button>
                                <button type="button" class="canvas-tool-btn" onclick="zoomOutCanvas()" title="Zoom Out">
                                    <span>−</span>
                                </button>
                                <button type="button" class="canvas-tool-btn" onclick="zoomInCanvas()" title="Zoom In">
                                    <span>+</span>
                                </button>
                                <button type="button" class="canvas-tool-btn" onclick="fitCanvas()" title="Fit Canvas">
                                    <span>Fit</span>
                                </button>
                            </div>
                            <div class="canvas bpmn-canvas is-active" id="newBpmnContainer"></div>
                            <div class="canvas bpmn-canvas" id="historyBpmnContainer"></div>
                        </div>

                        <aside class="properties-shell" id="propertiesSidebar">
                            <!-- 伸缩按钮 -->
                            <button class="panel-toggle-btn" onclick="togglePropertiesSidebar()" title="Collapse/Expand Properties">
                                <svg id="propertiesToggleIcon" width="18" height="18" viewBox="0 0 24 24">
                                    <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" fill="currentColor" />
                                </svg>
                            </button>

                            <div class="properties-header">
                                <span class="properties-title">Node Properties</span>
                            </div>
                            <div id="properties-panel"></div>
                        </aside>
                    </div>
                </section>

                <aside class="right-sidebar" id="rightSidebar">
                    <button class="panel-toggle-btn" onclick="toggleRightSidebar()" title="收起/展开">
                        <svg id="rightToggleIcon" width="18" height="18" viewBox="0 0 24 24">
                            <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" fill="currentColor" />
                        </svg>
                    </button>

                    <div id="new-tab" class="tab-panel active">
                        <div class="panel-title">
                            <h3>New Flow</h3>
                        </div>
                        <div class="card">
                            <div class="form-group">
                                <label>Flow Name (Optional)</label>
                                <input type="text" id="flowName" class="input" placeholder="e.g., Purchase Approval Flow">
                                <div class="char-hint"><span id="nameLengthHint">0/12</span></div>
                            </div>
                            <div class="form-group">
                                <label>Process Description <span class="required">*</span></label>
                                <textarea id="processDesc" class="textarea"
                                    placeholder="Describe the process start, key nodes, branching conditions, and end conditions..."></textarea>
                                <div class="char-hint"><span id="descLengthHint">0/9999</span></div>
                            </div>
                            <button id="generateBtn" class="btn-primary btn-full" onclick="generateBpmn()">
                                <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                                    <path
                                        d="M12 2l2.4 5.6L20 10l-5.6 2.4L12 18l-2.4-5.6L4 10l5.6-2.4L12 2zm7 14l1.2 2.8L23 20l-2.8 1.2L19 24l-1.2-2.8L15 20l2.8-1.2L19 16zM5 15l.9 2.1L8 18l-2.1.9L5 21l-.9-2.1L2 18l2.1-.9L5 15z"
                                        fill="currentColor" />
                                </svg>
                                <span>Generate Flowchart</span>
                            </button>
                            <button id="importDocBtn" class="btn-primary btn-full" onclick="document.getElementById('importDocFile').click()">
                                <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M12 3v10.17l3.59-3.58L17 11l-5 5-5-5 1.41-1.41L11 13.17V3h1zM5 19h14v2H5z" fill="currentColor" />
                                </svg>
                                <span>Import Document</span>
                            </button>
                            <input type="file" id="importDocFile" accept=".txt,.doc,.docx,.dot" hidden onchange="importDocument()">
                        </div>
                    </div>

                    <div id="history-tab" class="tab-panel">
                        <div class="panel-title">
                            <h3>Flow Fine-tuning</h3>
                        </div>

                        <div class="chat-scroll-container">
                            <div class="card">
                                <div class="card info-card" id="flowInfo">
                                    <div class="chat-bubble-wrapper">
                                        <div class="chat-time" id="infoTime">-</div>
                                        <div class="chat-bubble">
                                            <div class="chat-content" id="infoDesc">-</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="chat-input-fixed-wrapper">
                            <div class="chat-input-wrapper">
                                <textarea id="fineTuneInstruction" class="chat-input"
                                    placeholder="Enter fine-tuning instructions, e.g., add budget validation node before approval"></textarea>
                                <div class="chat-input-actions">
                                    <button type="button" class="btn-save" onclick="saveBpmnEditor()">
                                        <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24"
                                            aria-hidden="true">
                                            <path
                                                d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"
                                                fill="currentColor" />
                                        </svg>
                                        <span>Save Edit</span>
                                    </button>
                                    <button type="button" class="btn-export" onclick="exportBpmn()">
                                        <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24"
                                            aria-hidden="true">
                                            <path d="M12 3l5 5h-3v6h-4V8H7l5-5zm-7 13h14v5H5v-5z" fill="currentColor" />
                                        </svg>
                                        <span>Export BPMN</span>
                                    </button>
                                    <button type="button" class="btn-finetune" onclick="fineTuneBpmn()" id="fineTuneBtn">
                                        <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24"
                                            aria-hidden="true">
                                            <path
                                                d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zm18.37-11.48a1 1 0 0 0 0-1.41l-1.73-1.73a1 1 0 0 0-1.41 0l-1.36 1.36 3.75 3.75 1.75-1.97z"
                                                fill="currentColor" />
                                        </svg>
                                        <span>Fine-tune Flow</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </aside>
            </div>
        </main>
    </div>

    <script src="frontend_resource/js/config.js" type="module"></script>
    <script src="frontend_resource/js/ui-handler.js" type="module"></script>
    <script src="frontend_resource/js/api-service.js" type="module"></script>
    <script src="frontend_resource/js/page-state.js" type="module"></script>
    <script src="frontend_resource/js/app.js" type="module"></script>
    <script src="frontend_resource/js/sidebar-btn.js" type="module"></script>
    <script src="frontend_resource/js/renderBPMN.js" type="module"></script>
</body>

</html>
